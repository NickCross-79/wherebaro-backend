# Turns a Dependabot @wfcd/items PR into a deploy without anyone watching it.
#
# `--auto` queues the merge rather than performing it, so the PR lands only once
# required checks pass. That safety depends entirely on main having required
# status checks configured: with none, GitHub merges immediately and the build
# result is never consulted.
name: Auto-merge @wfcd/items updates

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only Dependabot's own PRs. Without this guard any PR author could reach
    # the merge step by naming their branch convincingly.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Scoped to the one package this automation is for. Any other Dependabot
      # PR (a security update, say) is left alone for a human to review.
      - name: Enable auto-merge
        if: steps.metadata.outputs.dependency-names == '@wfcd/items'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
